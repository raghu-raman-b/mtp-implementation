# LIR v2: which model does what. Edit and rerun generate_lir2.py; cached answers are kept per model and prompt.
#
# A model is either
#   - a Hugging Face GGUF reference "org/repo:file.gguf"  -> runs locally on llama.cpp, or
#   - an OpenAI model name, e.g. "gpt-6-luna"              -> runs on the OpenAI API (key from .env, see [api])

[generator]                     # parts, objectives, key points, term candidates, goals, facets
# One model for all three roles: they share one server, whose settings come from this first section.
engine = "vllm"                 # "vllm" (Hugging Face repo) | "llamacpp" (org/repo:file.gguf) | "openai" (API model name)
model = "Qwen/Qwen3.8-27B-FP8"
slots = 128                     # requests in flight (vLLM --max-num-seqs); two runs split them with --slots
max_model_len = 65536           # longest prompt + answer (thinking included)
max_tokens = 0                  # 0 = no cap on thinking or answer (up to max_model_len)
sampling = { temperature = 1.0, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0 }  # Qwen, thinking mode
kv_tokens = 0                   # llama.cpp only
think_budget = 0                # llama.cpp only

[verifier]                      # keep/drop, names, definitions, grounding, same-concept, relations, labels
engine = "vllm"
model = "Qwen/Qwen3.8-27B-FP8"

[judge]                         # checks every item (knowledge and activities) and rewrites failures once
engine = "vllm"
model = "Qwen/Qwen3.8-27B-FP8"
# Roles that name the same model share one server (the first role's settings apply).
# Leave [judge] out and the verifier judges.
#
# llama.cpp instead (338 tok/s at 32 requests on the RTX PRO 6000 for Qwen 27B Q8, against vLLM below):
#   model = "unsloth/Qwen3.8-27B-GGUF:Qwen3.8-27B-Q8_0.gguf", slots = 96, kv_tokens = 655360, think_budget = 8192
# Gemma on the 12 GB RTX 5070: generator unsloth/gemma-4-E4B-it-GGUF:gemma-4-E4B-it-UD-Q8_K_XL.gguf (32 slots,
# kv_tokens 131072, think 8192); verifier/judge unsloth/gemma-4-12B-it-qat-GGUF:gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
# (8 slots, kv_tokens 32768, think 4096), exclusive_gpu = true.

[engine]
vllm = "~/vllm-venv/bin/vllm"                            # built by setup_ec2.sh; or the VLLM environment variable
gpu_memory_utilization = 0.92
reasoning_parser = "qwen3"
prefix_caching = true           # vLLM: reuse shared prompt starts (costs memory on hybrid models such as Qwen 3.8)
# MTP (Qwen's built-in draft head): 109 vs 45 tok/s for one request; ~62 requests fit at once instead of ~128
vllm_args = ["--speculative-config", '{"method":"mtp","num_speculative_tokens":3}']
llama_server = "~/llama.cpp/build/bin/llama-server"     # or the LLAMA_SERVER environment variable
exclusive_gpu = false           # true: one model on the GPU at a time (12 GB card)
extra_args = []                 # more llama-server flags

[steps]                         # which role runs a step (defaults in pipeline2/context.py DEFAULT_STEPS)
# keep = "generator"            # e.g. to compare E4B with 12B on keep/drop
# Steps that share a prompt start must use the same role: objective + key_points; keep + name + define + ground;
# same + refine.

[api]
env_file = ".env"
key_var = "OPEN_AI_API"
base_url = "https://api.openai.com/v1"
budget_usd = 2.28               # total across all runs (api_spend.json); no call is sent past it

[api.prices."gpt-6-luna"]       # US$ per million tokens
input = 0.10
cached_input = 0.01
output = 0.50

[videos]
height = 720
