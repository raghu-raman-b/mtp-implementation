/* Pipeline v3 documentation. One self-contained file: no fonts, scripts or styles from the network.

:root {

  --accent: #2f55d4; --accent-ink: #1f3fae; --accent-soft: rgba(47, 85, 212, .08);
  --ok: #157a4c; --ok-soft: rgba(21, 122, 76, .09); --bad: #b8352c; --bad-soft: rgba(184, 53, 44, .08);
  --warn: #9a5b00; --warn-soft: rgba(196, 128, 0, .11);
  --c-code: #5b6475; --c-gen: #2f6fd6; --c-judge: #7b4fd0; --c-emb: #12897a; --c-qa: #c8611c; --c-skip: #9aa0aa;

  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, ui-serif, serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1115; --surface: #161a21; --surface-2: #1c212a; --surface-3: #232935;
  --ink: #e9ebef; --ink-2: #c6cbd4; --muted: #8f97a4; --line: #262c37; --line-2: #343b48;
  --accent: #8fb0ff; --accent-ink: #b9cdff; --accent-soft: rgba(143, 176, 255, .11);
  --ok: #5fd39a; --ok-soft: rgba(95, 211, 154, .1); --bad: #ff8a80; --bad-soft: rgba(255, 138, 128, .1);
  --warn: #ffc56b; --warn-soft: rgba(255, 197, 107, .1);
  --c-code: #9aa3b5; --c-gen: #6ea2ff; --c-judge: #b49bff; --c-emb: #3fd0bd; --c-qa: #ff9d5c; --c-skip: #6b7280;
  --hl: #8a6d00; --hl-ink: #fff6cf;
  --t-key: #d7a6ff; --t-str: #8be0a8; --t-num: #ffb86b; --t-kw: #8fb0ff; --t-com: #7f8796; --t-ph: #ff9d5c; --t-head: #b9cdff;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #161a21; --surface-2: #1c212a; --surface-3: #232935;
  --ink: #e9ebef; --ink-2: #c6cbd4; --muted: #8f97a4; --line: #262c37; --line-2: #343b48;
  --accent: #8fb0ff; --accent-ink: #b9cdff; --accent-soft: rgba(143, 176, 255, .11);
  --ok: #5fd39a; --ok-soft: rgba(95, 211, 154, .1); --bad: #ff8a80; --bad-soft: rgba(255, 138, 128, .1);
  --warn: #ffc56b; --warn-soft: rgba(255, 197, 107, .1);
  --c-code: #9aa3b5; --c-gen: #6ea2ff; --c-judge: #b49bff; --c-emb: #3fd0bd; --c-qa: #ff9d5c; --c-skip: #6b7280;
  --hl: #8a6d00; --hl-ink: #fff6cf;

  color-scheme: dark; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 24px; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 19.5px/1.72 var(--sans); -webkit-font-smoothing: antialiased; }
@media (max-width: 640px) { body { font-size: 17.5px; } }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }

/* ---------- layout */
.shell { display: grid; grid-template-columns: 270px minmax(0, 1fr); max-width: 1440px; margin: 0 auto; }
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 28px 16px 60px 22px; border-right: 1px solid var(--line); font-size: 14.5px; line-height: 1.45; }
.rail .brand { font: 650 16px/1.3 var(--sans); letter-spacing: -.01em; margin: 0 0 4px; }
.rail .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.rail .part { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin: 18px 0 4px 8px; }
.rail a { display: block; padding: 4px 8px; border-radius: 7px; color: var(--ink-2); text-decoration: none; border-left: 2px solid transparent; }
.rail a.l3 { padding-left: 20px; font-size: 13.5px; color: var(--muted); }
.rail a:hover { background: var(--accent-soft); color: var(--ink); }
.rail a.on { color: var(--accent-ink); background: var(--accent-soft); border-left-color: var(--accent); }
main { min-width: 0; padding: 0 max(16px, env(safe-area-inset-right)) 140px max(16px, env(safe-area-inset-left)); }
.doc { max-width: 1060px; margin: 0 auto; padding-inline: clamp(0px, 3vw, 44px); }
.doc > *:not(.wide):not(figure):not(.tablewrap):not(.cards):not(.tiles):not(details):not(pre):not(.stage-head):not(.split):not(.flow) { max-width: 72ch; }
.doc details, .doc pre { max-width: 100%; }

/* ---------- type */
h1, h2, h3, h4 { font-family: var(--sans); color: var(--ink); text-wrap: balance; letter-spacing: -.015em; }
h1 { font-size: clamp(38px, 6.2vw, 66px); line-height: 1.04; letter-spacing: -.035em; margin: 18px 0 22px; font-weight: 720; }
h2 { font-size: clamp(30px, 4vw, 42px); line-height: 1.12; margin: 0 0 18px; font-weight: 700; }
h3 { font-size: clamp(23px, 2.6vw, 28px); line-height: 1.2; margin: 64px 0 14px; font-weight: 680; }
h4 { font-size: 20px; line-height: 1.3; margin: 36px 0 8px; font-weight: 650; }
h3 + h4 { margin-top: 10px; }
p { margin: 0 0 1.05em; }
ul, ol { margin: 0 0 1.1em; padding-left: 1.3em; }
li { margin: .32em 0; }
li > ul, li > ol { margin: .3em 0 .2em; }
a { color: var(--accent); text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
strong, b { font-weight: 650; }
em { font-style: italic; }
code, .mono { font-family: var(--mono); }
:not(pre) > code { font-size: .84em; background: var(--surface-2); border: 1px solid var(--line); padding: .05em .38em; border-radius: 6px; color: var(--ink-2); overflow-wrap: anywhere; }
hr { border: 0; border-top: 1px solid var(--line); margin: 48px 0; }
.muted { color: var(--muted); }
.small { font-size: .84em; }
.lead { font-size: 1.18em; line-height: 1.6; color: var(--ink-2); }
.kicker { font: 600 12.5px var(--mono); text-transform: uppercase; letter-spacing: .16em; color: var(--accent); margin-bottom: 8px; display: block; }
.nowrap { white-space: nowrap; }

/* ---------- parts and sections */
.hero { padding: 72px 0 20px; }
.hero .lead { max-width: 62ch; }
.doc > h2 { margin-top: 110px; }
.part-head + h2 { margin-top: 30px; }
.part-head { margin: 120px 0 28px; padding-top: 34px; border-top: 2px solid var(--ink); }
.part-head .num { font: 600 13px var(--mono); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.part-head h2 { margin-top: 10px; }
.part-head p { color: var(--ink-2); }
section { scroll-margin-top: 20px; }
.redesign { display: inline-block; font: 600 12px var(--mono); letter-spacing: .06em; color: var(--warn); background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); padding: 3px 10px; border-radius: 99px; margin: 0 0 14px; }

/* ---------- tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin: 34px 0 10px; }
.tile { background: var(--surface); padding: 16px 18px 14px; }
.tile b { display: block; font: 700 27px/1.15 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tile span { font-size: 13px; color: var(--muted); line-height: 1.35; display: block; margin-top: 3px; }

/* ---------- callouts */
.callout { border-radius: 14px; padding: 16px 20px 6px; margin: 26px 0; border: 1px solid var(--line); background: var(--surface); position: relative; }
.callout > .tag { display: inline-block; font: 650 11.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }
.callout p, .callout li { font-size: .95em; }
.callout.why { border-left: 4px solid var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 25%, transparent); }
.callout.why > .tag { color: var(--accent-ink); }
.callout.ex { border-left: 4px solid var(--ok); background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 25%, transparent); }
.callout.ex > .tag { color: var(--ok); }
.callout.warn { border-left: 4px solid var(--warn); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.callout.warn > .tag { color: var(--warn); }
.callout.bad { border-left: 4px solid var(--bad); background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 25%, transparent); }
.callout.bad > .tag { color: var(--bad); }
.callout.note > .tag { color: var(--muted); }

/* ---------- before / after */
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 22px 0 28px; }
.split > div { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px 16px 8px; min-width: 0; }
.split .lbl { font: 650 11.5px var(--mono); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 6px; display: block; }
.split .before { border-top: 3px solid var(--bad); }
.split .before .lbl { color: var(--bad); }
.split .after { border-top: 3px solid var(--ok); }
.split .after .lbl { color: var(--ok); }
.split p, .split li { font-size: .9em; }
.split pre { font-size: 12.5px; margin: 6px 0 10px; }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; } }

/* ---------- code */
pre { font: 13.5px/1.6 var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 14px 0 22px; overflow-x: auto; white-space: pre; tab-size: 4; }
pre.wrap, pre[data-lang="prompt"], pre[data-lang="text"] { white-space: pre-wrap; overflow-wrap: anywhere; }
pre[data-lang="prompt"] { font-size: 13.5px; line-height: 1.65; max-height: 70vh; overflow-y: auto; }
.tk-key { color: var(--t-key); } .tk-str { color: var(--t-str); } .tk-num { color: var(--t-num); }
.tk-kw { color: var(--t-kw); font-weight: 600; } .tk-com { color: var(--t-com); font-style: italic; }
.tk-ph { color: var(--t-ph); font-weight: 600; } .tk-head { color: var(--t-head); font-weight: 700; }
.tk-li { color: var(--t-num); font-weight: 600; } .tk-flag { color: var(--t-key); } .tk-cmd { color: var(--t-kw); font-weight: 600; }
.tk-var { color: var(--t-ph); } .tk-p { color: var(--muted); }

/* ---------- details */
details { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin: 14px 0 22px; }
details > summary { cursor: pointer; list-style: none; padding: 11px 16px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; font-size: 16px; font-weight: 600; color: var(--ink); }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸"; color: var(--accent); font-size: 14px; transition: transform .15s; display: inline-block; }
details[open] > summary::before { transform: rotate(90deg); }
details > summary .meta { font: 500 12.5px var(--mono); color: var(--muted); }
details > :not(summary) { margin-left: 14px; margin-right: 14px; }
details > pre { margin-top: 2px; border-color: var(--line); background: var(--bg); }
details > p, details > ul, details > ol, details > .tablewrap { font-size: .92em; }
details.prompt > summary .mono { color: var(--accent-ink); font-size: 14.5px; }
summary:focus-visible, a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); margin: 18px 0 26px; }
table { border-collapse: collapse; width: 100%; font-size: 15.5px; line-height: 1.5; }
th, td { text-align: left; padding: 9px 13px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.total td { font-weight: 650; background: var(--surface-2); }
td code { font-size: .86em; }

/* ---------- stage blocks */
.stage-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 90px 0 6px; }
.stage-head .sid { font: 700 15px var(--mono); color: #fff; background: var(--c); padding: 3px 11px; border-radius: 8px; }
:root[data-theme="dark"] .stage-head .sid { color: #0f1115; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stage-head .sid { color: #0f1115; } }
.stage-head h3 { margin: 0; }
.worker { font: 600 12px var(--mono); padding: 3px 10px; border-radius: 99px; border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); color: var(--c); background: color-mix(in srgb, var(--c) 9%, transparent); white-space: nowrap; }
.w-code { --c: var(--c-code); } .w-gen { --c: var(--c-gen); } .w-judge { --c: var(--c-judge); } .w-emb { --c: var(--c-emb); } .w-qa { --c: var(--c-qa); } .w-skip { --c: var(--c-skip); }
.facts-grid { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 2px 16px; margin: 16px 0 24px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); font-size: 16px; line-height: 1.5; }
.facts-grid dt { font: 600 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding-top: 4px; }
.facts-grid dd { margin: 0 0 8px; min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 640px) { .facts-grid { grid-template-columns: 1fr; } .facts-grid dt { padding-top: 6px; } }

/* ---------- figures */
figure { margin: 30px 0 34px; }
figure .frame { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); padding: 18px; overflow-x: auto; }
figure svg { display: block; width: 100%; height: auto; min-width: 720px; }
figure svg.narrow { min-width: 0; }
figcaption { font-size: 15px; color: var(--muted); margin-top: 10px; line-height: 1.55; max-width: 80ch; }
svg text { font-family: var(--sans); fill: var(--ink); }
svg .t-s { font-size: 12.5px; } svg .t-m { font-size: 14px; } svg .t-l { font-size: 16px; font-weight: 650; } svg .t-xl { font-size: 18px; font-weight: 700; }
svg .t-mono { font-family: var(--mono); font-size: 12px; }
svg .mut { fill: var(--muted); } svg .ink2 { fill: var(--ink-2); }
svg .box { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.2; }
svg .box2 { fill: var(--surface-2); stroke: var(--line-2); stroke-width: 1; }
svg .col { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
svg .arrow { stroke: var(--muted); stroke-width: 1.6; fill: none; }
svg .arrowhead { fill: var(--muted); }
svg .acc { stroke: var(--accent); } svg .accf { fill: var(--accent); }
svg .k-code { fill: color-mix(in srgb, var(--c-code) 14%, var(--surface)); stroke: var(--c-code); }
svg .k-gen { fill: color-mix(in srgb, var(--c-gen) 14%, var(--surface)); stroke: var(--c-gen); }
svg .k-judge { fill: color-mix(in srgb, var(--c-judge) 14%, var(--surface)); stroke: var(--c-judge); }
svg .k-emb { fill: color-mix(in srgb, var(--c-emb) 14%, var(--surface)); stroke: var(--c-emb); }
svg .k-qa { fill: color-mix(in srgb, var(--c-qa) 14%, var(--surface)); stroke: var(--c-qa); }
svg .k-skip { fill: var(--surface); stroke: var(--c-skip); stroke-dasharray: 5 4; }
svg .k-ok { fill: color-mix(in srgb, var(--ok) 12%, var(--surface)); stroke: var(--ok); }
svg .k-bad { fill: color-mix(in srgb, var(--bad) 10%, var(--surface)); stroke: var(--bad); }
svg .k-acc { fill: color-mix(in srgb, var(--accent) 12%, var(--surface)); stroke: var(--accent); }
svg .sw { stroke-width: 1.4; }
svg .c-gen { fill: var(--c-gen); } svg .c-code { fill: var(--c-code); } svg .c-emb { fill: var(--c-emb); } svg .c-qa { fill: var(--c-qa); } svg .c-judge { fill: var(--c-judge); }
svg .c-ok { fill: var(--ok); } svg .c-bad { fill: var(--bad); } svg .c-acc { fill: var(--accent-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--ink-2); margin: 0 0 12px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; background: color-mix(in srgb, var(--c) 30%, var(--surface)); border: 1.5px solid var(--c); }
.legend .lg-skip::before { border-style: dashed; background: var(--surface); }

/* ---------- cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin: 22px 0 28px; }
.card { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 16px 18px 8px; }
.card h4 { margin: 0 0 6px; font-size: 18px; }
.card p, .card li { font-size: 15.5px; color: var(--ink-2); line-height: 1.55; }
.card .k { font: 650 11.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 4px; }

/* ---------- timeline of changes */
.log { border-left: 2px solid var(--line-2); margin: 20px 0 30px 6px; padding-left: 22px; }
.log .ent { position: relative; margin: 0 0 18px; }
.log .ent::before { content: ""; position: absolute; left: -29px; top: 9px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.log .when { font: 600 12.5px var(--mono); color: var(--muted); }
.log p { margin: 2px 0 0; font-size: .93em; }

/* ---------- floating tools: theme, highlights, contents */
.tools { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); z-index: 40; display: flex; gap: 8px; }
.tools button, .hl-btn, .panel button { font: 600 13.5px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 99px; padding: 8px 14px; cursor: pointer; box-shadow: 0 6px 20px -8px rgba(0,0,0,.35); }
.tools button:hover, .panel button:hover { border-color: var(--accent); color: var(--accent-ink); }
#tocbtn { display: none; }
.hl-btn { position: absolute; z-index: 60; display: none; background: var(--ink); color: var(--bg); border-color: var(--ink); }
mark.rh { background: var(--hl); color: var(--hl-ink); border-radius: 3px; padding: 0 1px; cursor: pointer; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
mark.rh.flash { outline: 3px solid var(--accent); }
.panel { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: 70px; z-index: 50; width: min(420px, calc(100vw - 28px)); max-height: min(70vh, 640px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.5); padding: 14px 16px; display: none; font-size: 15px; line-height: 1.5; }
.panel.open { display: block; }
.panel h5 { margin: 0 0 4px; font: 650 16px var(--sans); }
.panel .row { display: flex; gap: 8px; align-items: center; margin: 6px 0 10px; flex-wrap: wrap; }
.panel ol { padding-left: 1.2em; margin: 8px 0; }
.panel li { margin: 0 0 10px; }
.panel li a { color: var(--ink); text-decoration: none; display: block; }
.panel li a:hover q { background: var(--hl); color: var(--hl-ink); }
.panel li .where { font-size: 12.5px; color: var(--muted); display: block; }
.panel li button { font-size: 12px; padding: 2px 9px; box-shadow: none; margin-top: 3px; }
.panel q { quotes: "“" "”"; }

@media (max-width: 1100px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: fixed; inset: 0 auto 0 0; width: min(330px, 88vw); z-index: 55; background: var(--bg); transform: translateX(-102%); transition: transform .2s; visibility: hidden; }
  .rail.open { transform: none; visibility: visible; box-shadow: 0 0 60px rgba(0,0,0,.4); }
  #tocbtn { display: inline-block; }
