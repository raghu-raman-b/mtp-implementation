<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8">
<title>Course</title>
<link rel="icon" href="data:,">
<link rel="preload" href="/static/vendor/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Geist"; src: url("/static/vendor/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 400 700; font-style: normal; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("/static/vendor/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 400 700; font-style: normal; font-display: swap; }
</style>
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preload" href="/api/home" as="fetch" crossorigin="anonymous">
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<header class="top" id="top">
  <div class="top-in">
    <a class="brand" href="#/" id="brand"><span class="mark" aria-hidden="true"><span></span></span><span class="brand-t" id="brand-t">Course</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-page="home">Roadmap</a>
      <a href="#/map" data-page="map">Lecture map</a>
      <a href="#/concepts" data-page="concepts">Concept map</a>
      <a href="#/ask" data-page="ask">Ask</a>
    </nav>
    <div class="tools">
      <button class="icon-btn" id="search-btn" aria-label="Search the course" title="Search (/)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button class="icon-btn" id="notes-btn" aria-label="Your notes" title="Your notes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h4"/></svg><span class="count" id="notes-count" hidden></span></button>
      <div class="menu-wrap">
        <button class="icon-btn" id="menu-btn" aria-label="More options" aria-haspopup="true" aria-expanded="false" title="More"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
        <div class="menu" id="menu" hidden>
          <label class="switch-row"><span>Developer mode<small>IDs, judge marks, sources, timing</small></span><input type="checkbox" id="dev-box" role="switch"></label>
          <label class="switch-row"><span>Play videos from YouTube<small>instead of the files on this computer</small></span><input type="checkbox" id="yt-box" role="switch"></label>
        </div>
      </div>
    </div>
  </div>
</header>
<main id="app" tabindex="-1"><div class="empty"><span class="spin"></span> Loading the course…</div></main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="notes" aria-label="Your notes" hidden>
  <div class="drawer-head"><h2>Your notes</h2><button class="icon-btn" id="notes-close" aria-label="Close notes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="drawer-body" id="notes-body"></div>
</aside>
<div class="search" id="search" role="dialog" aria-modal="true" aria-label="Search the course" hidden>
  <div class="search-box">
    <label class="search-field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span class="sr">Search lectures and concepts</span><input id="search-input" type="search" placeholder="Search lectures and concepts" autocomplete="off"><kbd>Esc</kbd></label>
    <div class="search-results" id="search-results"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/vendor/dagre.min.js" defer></script>
<script src="/static/vendor/katex/katex.min.js" defer></script>
<script src="/static/vendor/katex/contrib/auto-render.min.js" defer></script>
<script src="/static/math.js" defer></script>
<script src="/static/app.js" defer></script>
</body>
</html>
