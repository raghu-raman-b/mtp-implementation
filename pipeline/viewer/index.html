<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Viewer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
<script>try { var t = localStorage.getItem("v3:theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/" id="brand">Course</a>
  <nav class="nav">
    <a href="#/">Lectures</a>
    <a href="#/glossary">Glossary</a>
    <a href="#/map">Concept map</a>
    <a href="#/review" id="nav-review">Review</a>
  </nav>
  <form class="ask" id="ask-form" autocomplete="off">
    <input id="ask-input" type="search" placeholder="Ask a question about the course…" aria-label="Ask a question">
    <button type="submit" class="primary">Ask</button>
  </form>
  <div class="tools">
    <button class="ghost small" id="theme-btn" title="Switch between light and dark">Theme</button>
    <label class="dev-toggle" title="Developer mode: IDs, counts, sources"><input type="checkbox" id="dev-box"> Dev</label>
  </div>
</header>
<main id="app"><div class="empty">Loading the course…</div></main>
<aside id="drawer" class="drawer" hidden>
  <div class="drawer-head"><h3>Your question</h3><button class="ghost" id="drawer-close" aria-label="Close">✕</button></div>
  <div id="drawer-body"></div>
</aside>
<script src="/static/vendor/dagre.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
