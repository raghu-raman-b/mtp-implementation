<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signal Ask</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F5F6F8}
a{color:#2E5BFF}a:hover{color:#1F44D6}
.tick{animation:tick .26s cubic-bezier(.3,1.5,.5,1) both}
@keyframes tick{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.lbl{animation:lbl .22s ease-out both}
@keyframes lbl{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(46,91,255,.18)}}
.caret{display:inline-block;width:2px;height:1.05em;background:#2E5BFF;vertical-align:-3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.cite{transition:background .15s, color .15s}
.cite:hover{background:#2E5BFF;color:#FFFFFF}
.sq{transition:transform .18s cubic-bezier(.3,1.4,.5,1), box-shadow .18s}
.sq:hover{transform:translateY(-2px);box-shadow:0 12px 24px -16px rgba(14,17,22,.35), inset 0 0 0 1px #2E5BFF}
</style>
</helmet>
<div style="height: 100vh; min-height: 760px; display: flex; flex-direction: column; background: #F5F6F8; color: #0E1116; font-family: Geist, system-ui, sans-serif; font-size: 14px; line-height: 1.5">
  <header style="flex: none; border-bottom: 1px solid #E4E7EC; background: rgba(245,246,248,.8)">
    <div style="max-width: 1320px; margin: 0 auto; padding: 10px 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
      <a href="C-Roadmap.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0E1116; font-weight: 600; letter-spacing: -0.01em"><span style="width: 26px; height: 26px; border-radius: 8px; background: #0E1116; display: grid; place-items: center"><span style="width: 10px; height: 10px; border-radius: 3px; background: #C8F169"></span></span>VR &amp; AR Foundations</a>
      <nav aria-label="Main" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #EAECF0; margin: 0 auto">
        <a href="C-Roadmap.dc.html" style="padding: 7px 14px; border-radius: 8px; color: #596171; text-decoration: none; font-weight: 500">Roadmap</a>
        <a href="#" style="padding: 7px 14px; border-radius: 8px; color: #596171; text-decoration: none; font-weight: 500">Lecture map</a>
        <a href="#" style="padding: 7px 14px; border-radius: 8px; color: #596171; text-decoration: none; font-weight: 500">Concept map</a>
        <a href="#" style="padding: 7px 14px; border-radius: 8px; background: #FFFFFF; color: #0E1116; text-decoration: none; font-weight: 600; box-shadow: 0 1px 2px rgba(14,17,22,.08)">Ask</a>
      </nav>
      <div style="display: flex; gap: 4px">
        <button aria-label="Search the course" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; color: #0E1116; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
        <button aria-label="Your notes" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; color: #0E1116; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 11h7M9 15h7M9 7h4"></path></svg></button>
      </div>
    </div>
  </header>

  <main style="flex: 1 1 auto; overflow: auto">
    <div style="max-width: 820px; margin: 0 auto; padding: 32px 28px; display: flex; flex-direction: column; gap: 16px">
      <div style="align-self: flex-end; max-width: 85%; padding: 12px 16px; border-radius: 16px 16px 4px 16px; background: #0E1116; color: #F5F6F8; font-size: 16px; font-weight: 500; letter-spacing: -0.01em">{{question}}</div>

      <section aria-label="What the model is doing" style="background: #FFFFFF; border-radius: 16px; box-shadow: inset 0 0 0 1px #E4E7EC; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
          <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #596171">WHAT THE MODEL IS DOING</span>
          <span style="{{badge}}">{{status}}</span>
        </div>
        <div style="position: relative; height: 4px; border-radius: 2px; background: #EEF0F3; overflow: hidden"><span style="{{bar}}"></span></div>
        <ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: 10px">
          <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
            <li style="display: flex; gap: 10px; align-items: flex-start; min-height: 52px">
              <sc-if value="{{s.done}}" hint-placeholder-val="{{ true }}"><span class="tick" style="width: 22px; height: 22px; flex: none; border-radius: 7px; background: #C8F169; color: #0E1116; display: grid; place-items: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></sc-if>
              <sc-if value="{{s.active}}" hint-placeholder-val="{{ false }}"><span class="pulse" style="width: 22px; height: 22px; flex: none; border-radius: 7px; background: #2E5BFF; display: grid; place-items: center"><span style="width: 6px; height: 6px; border-radius: 50%; background: #FFFFFF"></span></span></sc-if>
              <sc-if value="{{s.pending}}" hint-placeholder-val="{{ false }}"><span style="width: 22px; height: 22px; flex: none; border-radius: 7px; box-shadow: inset 0 0 0 1.5px #D5D9E0"></span></sc-if>
              <span class="lbl" style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
                <span style="{{s.labelStyle}}">{{s.label}}</span>
                <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #596171; line-height: 1.4">{{s.sum}}</span>
              </span>
            </li>
          </sc-for>
        </ol>
      </section>

      <article aria-live="polite" style="background: #FFFFFF; border-radius: 16px; box-shadow: inset 0 0 0 1px #E4E7EC, 0 20px 40px -32px rgba(14,17,22,.3); padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; font-size: 16px; line-height: 1.7; min-height: 120px">
        <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><span style="color: #8A93A3; font-size: 14px">The answer appears here as it is written.</span></sc-if>
        <sc-for list="{{paras}}" as="p" hint-placeholder-count="3">
          <sc-if value="{{p.visible}}" hint-placeholder-val="{{ true }}">
            <p style="{{p.style}}"><sc-if value="{{p.bullet}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; left: 2px; top: 11px; width: 6px; height: 6px; border-radius: 2px; background: #2E5BFF"></span></sc-if><sc-for list="{{p.toks}}" as="t" hint-placeholder-count="20"><sc-if value="{{t.lead}}" hint-placeholder-val="{{ false }}"><strong style="font-weight: 600">{{t.t}} </strong></sc-if><sc-if value="{{t.text}}" hint-placeholder-val="{{ true }}">{{t.t}}</sc-if><sc-if value="{{t.cite}}" hint-placeholder-val="{{ false }}"><a href="C-Player.dc.html" class="cite" style="display: inline-flex; align-items: center; gap: 4px; margin-right: 4px; padding: 0 7px; border-radius: 6px; background: #EEF2FF; color: #2E5BFF; text-decoration: none; font-family: 'Geist Mono', monospace; font-size: 11.5px; line-height: 22px; vertical-align: 1px; white-space: nowrap"><svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>{{t.t}}</a></sc-if></sc-for><sc-if value="{{p.caret}}" hint-placeholder-val="{{ false }}"><span class="caret"></span></sc-if></p>
          </sc-if>
        </sc-for>
        <sc-if value="{{done}}" hint-placeholder-val="{{ true }}">
          <div class="lbl" style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 12px; border-top: 1px solid #EEF0F3; font-size: 13px; color: #596171">
            <span>Sources</span>
            <sc-for list="{{sources}}" as="s" hint-placeholder-count="2"><a href="C-Player.dc.html" style="padding: 3px 10px; border-radius: 999px; background: #F0F2F5; color: #0E1116; text-decoration: none; font-weight: 500">{{s}}</a></sc-for>
          </div>
        </sc-if>
      </article>
    </div>
  </main>

  <footer style="flex: none; border-top: 1px solid #E4E7EC; background: rgba(245,246,248,.9)">
    <div style="max-width: 820px; margin: 0 auto; padding: 14px 28px 20px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 8px">
        <sc-for list="{{samples}}" as="q" hint-placeholder-count="4"><button class="sq" onClick="{{q.pick}}" style="{{q.style}}"><span style="font-family: 'Geist Mono', monospace; font-size: 10.5px; color: #596171">{{q.tag}}</span><span>{{q.q}}</span></button></sc-for>
      </div>
      <label style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 14px; padding: 5px 5px 5px 16px; box-shadow: inset 0 0 0 1px #D5D9E0, 0 8px 20px -14px rgba(14,17,22,.3)">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ask a question about the course</span>
        <input placeholder="Ask anything in the 63 lectures" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #0E1116; height: 40px">
        <button aria-label="Ask" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: #2E5BFF; color: #FFFFFF; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
      </label>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.QS = [
      { q: 'What is the difference between immersion and presence?', tag: 'TWO CONCEPTS', sources: ['Lecture 8 · Issues & Challenges', 'Lecture 9 · Issues & Challenges'],
        steps: [{ label: 'Loading concept card: immersion', sum: 'card of immersion; 21 facts' }, { label: 'Loading concept card: presence', sum: 'card of presence; 24 facts' }],
        paras: [
          { parts: ['In virtual reality (VR), the difference between immersion and presence is the difference between a technological issue and a psychological one', ['8', '21:49'], ['9', '23:22'], '.'] },
          { li: true, lead: 'Immersion', parts: ['is the objective, quantifiable degree to which a VR system projects stimuli onto a user’s sensory receptors in a way that is extensive, matching, surrounding, vivid, interactive, and plot-informing', ['8', '10:12'], '. It is considered the technological experience', ['8', '26:40'], '.'] },
          { li: true, lead: 'Presence', parts: ['is a subjective psychological state or sense of being in the virtual environment', ['8', '26:40'], '. It occurs when a user perceives computer-generated stimuli as coming from the real world because they fail to acknowledge the technology’s role in the experience', ['8', '23:14'], ['8', '25:05'], '.'] },
          { parts: ['While immersion can aid and produce presence, it does not ensure it; however, the greater the immersion provided by a system, the greater the potential for a user to feel present', ['8', '26:40'], '.'] }
        ] },
      { q: 'what is HRTF', tag: 'AN ACRONYM', sources: ['Lecture 30 · Auditory Sense & Immersive Experience'],
        steps: [{ label: 'Loading concept card: HRTF → head-related transfer function', sum: 'card of head-related transfer function; 4 facts' }],
        paras: [
          { parts: ['Head-related transfer function (HRTF) is a model that describes how a listener receives sound from a specific location in space', ['30', '24:39'], ['30', '21:08'], '. It depends on the unique size and shape of an individual’s head, ears, and ear canal', ['30', '24:39'], '.'] },
          { parts: ['Since every person has a unique HRTF, systems typically use a model for an average listener', ['30', '24:39'], '. A pair of HRTFs for both ears can be used to synthesize binaural sound and implement localization effects in extended reality (XR) systems', ['30', '21:08'], '.'] }
        ] },
      { q: 'What do I need to know before lecture 9?', tag: 'PREREQUISITES', sources: ['Lecture 2', 'Lecture 4 · Definitions', 'Lecture 7'],
        steps: [{ label: 'Checking the prerequisites of lecture 9', sum: 'lecture 9: revise 4, 2, 7; relies on 4 earlier concepts' }],
        paras: [
          { parts: ['Before lecture 9, you should be familiar with the following concepts:'] },
          { li: true, lead: 'Virtual reality system:', parts: ['A system that presents a computer-generated artificial environment, provides sensory stimuli for an immersive experience, and allows user actions to partially determine what happens within it', ['4', '6:01'], '.'] },
          { li: true, lead: 'Reality:', parts: ['The state or quality of being real, existing independently of ideas or being a real thing as distinguished from something merely apparent', ['4', '2:14'], '.'] },
          { li: true, lead: 'Immersion:', parts: ['The quantifiable degree to which a VR system projects stimuli onto a user’s sensory receptors in a way that is extensive, matching, surrounding, vivid, interactive, and plot-informing', ['2', '18:51'], '.'] },
          { li: true, lead: 'Three-dimensional registration:', parts: ['The anchoring of virtual content in augmented reality at a specific place in the real world so it appears to be part of the physical environment', ['7', '14:38'], '.'] },
          { parts: ['It is recommended to revise lectures 4 (Definitions), 2 (Application Domains and System Categories), and 7 (Historical Evolution) first.'] }
        ] },
      { q: 'Who won the 2022 FIFA World Cup?', tag: 'OUTSIDE THE COURSE', sources: ['Not covered by the course'],
        steps: [], paras: [{ parts: ['The course does not cover who won the 2022 FIFA World Cup.'] }] }
    ];
    this.timers = [];
    this.state = { qi: 0, step: 2, shown: 100000, done: true };
  }
  componentWillUnmount() { this.clear(); }
  clear() { this.timers.forEach((t) => { clearTimeout(t); clearInterval(t); }); this.timers = []; }
  total(Q) { let n = 0; Q.paras.forEach((p) => { if (p.lead) n++; p.parts.forEach((x) => { n += typeof x === 'string' ? x.split(' ').filter(Boolean).length : 1; }); }); return n; }
  play(qi) {
    this.clear();
    const Q = this.QS[qi], k = Q.steps.length, total = this.total(Q);
    this.setState({ qi, step: 0, shown: 0, done: false });
    for (let i = 1; i <= k; i++) this.timers.push(setTimeout(() => this.setState({ step: i }), 1000 * i));
    this.timers.push(setTimeout(() => {
      const iv = setInterval(() => {
        const next = this.state.shown + 2;
        if (next >= total) { clearInterval(iv); this.setState({ shown: total, done: true }); }
        else this.setState({ shown: next });
      }, 40);
      this.timers.push(iv);
    }, 1000 * k + 500));
  }
  renderVals() {
    const { qi, step, shown, done } = this.state, Q = this.QS[qi], k = Q.steps.length, total = this.total(Q);
    const all = Q.steps.concat([{ label: 'Writing the answer', sum: done ? 'done' : step >= k ? 'streaming' : 'waiting' }]);
    const steps = all.map((s, i) => {
      const isW = i === k, d = isW ? done : i < step, a = isW ? (step >= k && !done) : i === step;
      return { label: s.label, sum: s.sum, done: d, active: a, pending: !d && !a, labelStyle: 'font-size: 13px; font-weight: 600; letter-spacing: -0.01em; color: ' + (!d && !a ? '#8A93A3' : '#0E1116') + ';' };
    });
    const prog = done ? 100 : Math.round(100 * (Math.min(step, k) + (step >= k ? Math.min(shown, total) / Math.max(total, 1) : 0)) / (k + 1));
    let budget = step >= k ? shown : 0;
    const paras = Q.paras.map((p) => {
      const toks = [];
      if (p.lead && budget > 0) { toks.push({ t: p.lead, lead: true }); budget--; }
      p.parts.forEach((x) => {
        if (typeof x === 'string') { x.split(' ').filter(Boolean).forEach((w) => { if (budget > 0) { toks.push({ t: w + ' ', text: true }); budget--; } }); }
        else if (budget > 0) { toks.push({ t: 'Lecture ' + x[0] + ', ' + x[1], cite: true }); budget--; }
      });
      return { toks, visible: toks.length > 0, bullet: !!p.li, caret: false, style: 'margin: 0; position: relative; ' + (p.li ? 'padding-left: 18px;' : '') };
    });
    const vis = paras.filter((p) => p.visible);
    if (!done && vis.length) vis[vis.length - 1].caret = true;
    const samples = this.QS.map((x, i) => ({ q: x.q, tag: x.tag, pick: () => this.play(i), style: 'display: flex; flex-direction: column; gap: 2px; min-height: 64px; padding: 10px 12px; border-radius: 12px; border: 0; font: inherit; font-size: 13px; font-weight: 500; line-height: 1.35; text-align: left; cursor: pointer; ' + (i === qi ? 'background: #FFFFFF; color: #0E1116; box-shadow: inset 0 0 0 1.5px #2E5BFF;' : 'background: #FFFFFF; color: #0E1116; box-shadow: inset 0 0 0 1px #E4E7EC;') }));
    return {
      question: Q.q, steps, paras, done, sources: Q.sources, samples, empty: vis.length === 0,
      status: done ? 'Answered' : 'Working',
      badge: 'font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; ' + (done ? 'background: #C8F169; color: #0E1116;' : 'background: #EEF2FF; color: #2E5BFF;'),
      bar: 'position: absolute; left: 0; top: 0; bottom: 0; width: ' + prog + '%; background: ' + (done ? '#C8F169' : '#2E5BFF') + '; transition: width .3s ease;'
    };
  }
}
</script>
</body>
</html>
