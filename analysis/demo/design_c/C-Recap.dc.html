<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signal Recap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F5F6F8}
a{color:#2E5BFF}a:hover{color:#1F44D6}
.pt{animation:pt .32s cubic-bezier(.3,1.3,.5,1) both}
@keyframes pt{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.rc{transition:box-shadow .2s, transform .2s cubic-bezier(.3,1.4,.5,1)}
.rc:hover{transform:translateY(-1px)}
.nrow{transition:background .18s}
.nrow:hover{background:#F5F6F8}
</style>
</helmet>
<div style="min-height: 1220px; background: #F5F6F8; color: #0E1116; font-family: Geist, system-ui, sans-serif; font-size: 14px; line-height: 1.5">
  <header style="border-bottom: 1px solid #E4E7EC; background: rgba(245,246,248,.8)">
    <div style="max-width: 1320px; margin: 0 auto; padding: 10px 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
      <a href="C-Roadmap.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0E1116; font-weight: 600; letter-spacing: -0.01em"><span style="width: 26px; height: 26px; border-radius: 8px; background: #0E1116; display: grid; place-items: center"><span style="width: 10px; height: 10px; border-radius: 3px; background: #C8F169"></span></span>VR &amp; AR Foundations</a>
      <nav aria-label="Main" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #EAECF0; margin: 0 auto">
        <a href="C-Roadmap.dc.html" style="padding: 7px 14px; border-radius: 8px; color: #596171; text-decoration: none; font-weight: 500">Roadmap</a>
        <a href="#" style="padding: 7px 14px; border-radius: 8px; color: #596171; text-decoration: none; font-weight: 500">Lecture map</a>
        <a href="#" style="padding: 7px 14px; border-radius: 8px; color: #596171; text-decoration: none; font-weight: 500">Concept map</a>
        <a href="C-Ask.dc.html" style="padding: 7px 14px; border-radius: 8px; color: #596171; text-decoration: none; font-weight: 500">Ask</a>
      </nav>
      <div style="display: flex; gap: 4px">
        <button aria-label="Search the course" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; color: #0E1116; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
        <button aria-label="Your notes" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; color: #0E1116; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 11h7M9 15h7M9 7h4"></path></svg></button>
      </div>
    </div>
  </header>

  <main style="max-width: 1320px; margin: 0 auto; padding: 32px 28px 80px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #596171">Week 6 · Lecture 30</span>
        <h1 style="margin: 0; font-size: 36px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.05">Auditory Sense &amp; Immersive Experience</h1>
      </div>
      <nav aria-label="Lecture" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #EAECF0">
        <a href="C-Player.dc.html" style="padding: 7px 14px; border-radius: 8px; color: #596171; text-decoration: none; font-weight: 500">Watch</a>
        <a href="C-Activities.dc.html" style="padding: 7px 14px; border-radius: 8px; color: #596171; text-decoration: none; font-weight: 500">Activities</a>
        <a href="#" style="padding: 7px 14px; border-radius: 8px; background: #FFFFFF; color: #0E1116; text-decoration: none; font-weight: 600; box-shadow: 0 1px 2px rgba(14,17,22,.08)">Recap</a>
      </nav>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
      <section style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
          <div class="rc" style="{{c.box}}">
            <button onClick="{{c.toggle}}" aria-expanded="{{c.exp}}" style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 14px 18px; border: 0; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer">
              <span style="{{c.badge}}">{{c.n}}</span>
              <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 17px; letter-spacing: -0.02em">{{c.title}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 11px; opacity: .7">{{c.time}} · {{c.count}}</span></span>
              <span style="{{c.chev}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
            </button>
            <sc-if value="{{c.isOpen}}" hint-placeholder-val="{{ false }}">
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 8px; padding: 0 18px 18px">
                <sc-for list="{{c.points}}" as="p" hint-placeholder-count="4">
                  <div class="pt" style="{{p.style}}"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #9BC43F">{{p.i}}</span><span style="font-size: 14.5px; line-height: 1.5">{{p.t}}</span></div>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </section>

      <aside style="flex: 1 1 320px; max-width: 420px; background: #FFFFFF; border-radius: 20px; box-shadow: inset 0 0 0 1px #E4E7EC; padding: 20px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
          <h2 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Your notes</h2>
          <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #596171">4 sentences</span>
        </div>
        <span style="font-size: 13px; color: #596171">Saved from the captions. Click to watch that moment.</span>
        <sc-for list="{{notes}}" as="n" hint-placeholder-count="4">
          <a href="C-Player.dc.html" class="nrow" style="display: flex; flex-direction: column; gap: 6px; padding: 12px; margin: 0 -8px; border-radius: 12px; text-decoration: none; color: #0E1116; border-top: 1px solid #EEF0F3">
            <span style="display: flex; gap: 8px; align-items: center">
              <span style="font-family: 'Geist Mono', monospace; font-size: 11px; padding: 1px 6px; border-radius: 5px; background: #C8F169">{{n.id}}</span>
              <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #2E5BFF">▶ {{n.time}}</span>
            </span>
            <span style="font-size: 14.5px; line-height: 1.45">{{n.text}}</span>
          </a>
        </sc-for>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1220}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: 3 }; }
  renderVals() {
    const C = [
      ['Levels of sound perception', '0:24 – 4:53', ['Sound perception has social, warning, and primitive levels that together give an overall idea of surroundings.', 'Social-level sound perception helps an individual carry out social interactions with other individuals.', 'Warning-level sound perception provides an alert or warning about something, such as an event.', 'Primitive-level sound perception is intuitive perception of mostly ignored naive sounds and may not lead to meaningful action.', 'Identifying the desired sound perception level helps developers generate suitable auditory effects for a virtual reality system.']],
      ['Psychophysics and loudness', '4:53 – 11:44', ['Psychophysics studies perceptual phenomena caused by physical stimuli; psychoacoustics is its sound-specific branch.', "Stevens' power law relates perceived magnitude P to stimulus magnitude M by P = C M^x.", "The just noticeable difference, noticed in at least 50% of trials, follows Weber's law: delta M / M = C.", "Weber's law and Stevens' power law apply to auditory perception; a 3000 Hz pure tone's loudness exponent is 0.67.", 'A stimulus change is perceived only if it is above the just noticeable difference.']],
      ['Pitch perception', '11:46 – 14:02', ['In pitch perception, the frequency of a sound wave is called pitch.']],
      ['Sound localization', '14:03 – 20:55', ['Sound localization estimates the location of a sound source by hearing it.', 'In VR, sound localization matches auditory and visual cues to locate objects; mismatch can break presence and cause cybersickness.', 'Minimum audible angle (MAA) is the smallest detectable angular change, based on just noticeable difference, with the head as origin.', 'Spherical coordinates represent a sound source by azimuth (-180 to 180°), elevation (-90 to 90°), and radius from the head.', 'Minimum audible angle depends on sound frequency and direction; it can be 1 degree or extremely high.']],
      ['Binaural cues and HRTF', '21:01 – 26:05', ['Sound localization cues are either monaural, involving one ear, or binaural, involving both ears.', 'HRTFs model personal sound reception, but systems use average HRTF pairs to synthesize localized binaural XR sound.']]
    ];
    const open = this.state.open;
    const cards = C.map(([title, time, pts], i) => {
      const on = i === open;
      return {
        n: String(i + 1), title, time, count: pts.length + (pts.length === 1 ? ' point' : ' points'), isOpen: on, exp: on ? 'true' : 'false',
        toggle: () => this.setState({ open: on ? -1 : i }),
        box: 'border-radius: 16px; overflow: hidden; ' + (on ? 'background: #0E1116; color: #F5F6F8; box-shadow: 0 24px 50px -28px rgba(14,17,22,.6);' : 'background: #FFFFFF; color: #0E1116; box-shadow: inset 0 0 0 1px #E4E7EC;'),
        badge: 'width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; font-family: Geist Mono, monospace; font-weight: 600; ' + (on ? 'background: #C8F169; color: #0E1116;' : 'background: #F0F2F5; color: #0E1116;'),
        chev: 'display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; transition: transform .22s cubic-bezier(.3,1.4,.5,1); transform: rotate(' + (on ? '180' : '0') + 'deg);',
        points: pts.map((t, k) => ({ i: String(k + 1).padStart(2, '0'), t, style: 'display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 12px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); animation-delay: ' + (k * 60) + 'ms;' }))
      };
    });
    const notes = [
      { id: '30/134', time: '21:43', text: 'So, this is the difference in sound magnitude as heard by each ear.' },
      { id: '30/137', time: '22:04', text: 'So, now, acoustic shadow means the wave is not reaching the other ear.' },
      { id: '30/153', time: '24:39', text: 'Now there is an important concept called HRTF, which stands for head-related transfer functions.' },
      { id: '30/160', time: '25:33', text: 'Instead, what we can do is we can develop HRTF for an average listener.' }
    ];
    return { cards, notes };
  }
}
</script>
</body>
</html>
